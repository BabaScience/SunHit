# Sun-Hit Engine. Phase 0 (geometry) services plus shared infrastructure.
# Later phases add: sat-ingest, nowcast, open-meteo, predictor, truth-collector, trainer,
# notifier, scheduler, mosquitto, prometheus, grafana (see the technical spec).
name: sunhit

x-python-env: &python-env
  DATABASE_URL: postgres://sunhit:${POSTGRES_PASSWORD:-sunhit}@postgres:5432/sunhit
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://objectstore:8333
  S3_ACCESS_KEY: sunhit
  S3_SECRET_KEY: sunhit-dev-secret

services:
  api:
    build: { context: ., dockerfile: services/api/Dockerfile }
    environment:
      DATABASE_URL: postgres://sunhit:${POSTGRES_PASSWORD:-sunhit}@postgres:5432/sunhit
      REDIS_URL: redis://redis:6379
      MIGRATIONS_DIR: /app/db/migrations
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["${API_BIND:-127.0.0.1}:3000:3000"]   # Phase 0 is open: localhost or a private LAN IP only
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  horizon-builder:
    build: { context: ., dockerfile: services/horizon/Dockerfile }
    environment:
      <<: *python-env
      CACHE_DIR: /cache
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      objectstore: { condition: service_healthy }
    volumes: ["dsm-cache:/cache"]
    deploy: { replicas: 2 }

  dsm-builder:
    # Batch job, not a long-running service: docker compose run --rm dsm-builder ...
    build: { context: ., dockerfile: services/dsm-builder/Dockerfile }
    environment:
      <<: *python-env
      ALLOW_NONCOMMERCIAL_SOURCES: ${ALLOW_NONCOMMERCIAL_SOURCES:-false}
    volumes: ["./data:/app/data"]
    depends_on:
      postgres: { condition: service_healthy }
      objectstore: { condition: service_healthy }
    profiles: ["jobs"]

  postgres:
    image: timescale/timescaledb-ha:pg16   # includes PostGIS
    environment:
      POSTGRES_USER: sunhit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sunhit}
      POSTGRES_DB: sunhit
    volumes: ["pg-data:/home/postgres/pgdata/data"]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sunhit -d sunhit"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  objectstore:
    # S3-compatible object storage for rasters and image cubes. The spec named MinIO, which no
    # longer publishes images; SeaweedFS (Apache-2.0) speaks the same S3 API.
    image: chrislusf/seaweedfs:4.47
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=1024
    volumes:
      - objectstore-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro   # dev credentials only
    ports: ["127.0.0.1:8333:8333"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  dsm-cache: {}
  pg-data: {}
  objectstore-data: {}
