[project]
name = "sunhit-horizon"
version = "0.1.0"
description = "horizon-builder: per-spot horizon ray-casting and geometry queries (BullMQ worker)"
requires-python = ">=3.12"
dependencies = [
  "sunhit-geo[surface]",
  "bullmq>=2.15",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "prometheus-client>=0.21",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
sunhit-horizon-worker = "sunhit_horizon.worker:run"
sunhit-gate = "sunhit_horizon.gate:main"

[tool.uv.sources]
sunhit-geo = { path = "../../libs/geo", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sunhit_horizon"]
