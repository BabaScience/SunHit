[project]
name = "sunhit-dsm"
version = "0.1.0"
description = "dsm-builder: fetch open surface data and fuse it into the per-region surface model"
requires-python = ">=3.12"
dependencies = [
  "sunhit-geo[surface]",
  "requests>=2.32",
  "psycopg[binary]>=3.2",
]

[project.scripts]
sunhit-fetch-samples = "sunhit_dsm.fetch:main"
sunhit-dsm-build = "sunhit_dsm.build:main"

[tool.uv.sources]
sunhit-geo = { path = "../../libs/geo", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sunhit_dsm"]
